<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Takes the current URL and redirects to the root with the path as a query param
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + '?p=' + path + search + hash);
    </script>
  </head>
  <body>
  </body>
</html>
